[project]
name = "starter-algorithm"
version = "0.1.0"
description = "Detection engine and optional transport entry points"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
http = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
kafka = ["kafka-python>=2.3,<4"]
onnx = ["numpy>=1.26,<3", "onnxruntime>=1.20,<2"]

[tool.fastapi]
entrypoint = "starter_algorithm.http:app"
