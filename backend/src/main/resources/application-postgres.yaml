spring:
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:local_postgres_app}
  flyway:
    fail-on-missing-locations: true
    locations: filesystem:${POSTGRES_MIGRATIONS_PATH:../database/postgres/migrations}
starter:
  auth:
    demo-accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:false}
