spring:
  application:
    name: starter-backend
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
logging:
  structured:
    format:
      console: logstash
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
starter:
  auth:
    admin-password: ${DEMO_ADMIN_PASSWORD:local-admin}
    analyst-password: ${DEMO_ANALYST_PASSWORD:local-analyst}
  detection:
    transport: ${DETECTION_TRANSPORT:http}
    algorithm-url: ${ALGORITHM_URL:http://127.0.0.1:8000}
---
spring:
  config:
    activate:
      on-profile: "!postgres"
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
