name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [vue, react]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci --include=optional --no-audit --no-fund
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() }}
        with:
          name: playwright-${{ matrix.app }}
          path: frontend/${{ matrix.app }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Spring Boot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode --no-transfer-progress verify
        working-directory: backend

  algorithm:
    name: Python and ONNX Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: algorithm/uv.lock
      - run: uv sync --locked --extra http --extra kafka --extra onnx
      - run: uv run --no-sync python -m starter_algorithm
      - name: Check inference and transport imports
        run: |
          uv run --no-sync python - <<'PY'
          import onnxruntime as ort
          from starter_algorithm.algorithms.onnx_example.pipeline import Predictor
          from starter_algorithm.engine import detect
          from starter_algorithm.http import health
          from starter_algorithm.worker import main

          assert 'CPUExecutionProvider' in ort.get_available_providers()
          assert callable(Predictor.predict) and callable(main)
          assert health() == {'status': 'UP'}
          assert detect('sample-001')['label'] == 'demo'
          PY

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose --profile '*' config --quiet
      - run: docker compose -f compose.yaml -f database/postgres/backend.compose.yaml --profile '*' config --quiet
