name: Publish image

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to build and publish to GHCR
        required: true
        type: choice
        options:
          - vue
          - react
          - backend
          - algorithm-http
          - algorithm-http-onnx-cpu
          - algorithm-kafka
          - algorithm-kafka-onnx-cpu

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build selected component
        id: build
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$COMPONENT" in
            vue|react)
              context=.
              dockerfile=docker/frontend.Dockerfile
              build_args=(--build-arg "APP_DIR=$COMPONENT")
              ;;
            backend)
              context=backend
              dockerfile=backend/Dockerfile
              build_args=()
              ;;
            algorithm-http|algorithm-kafka|algorithm-http-onnx-cpu|algorithm-kafka-onnx-cpu)
              context=algorithm
              dockerfile=algorithm/Dockerfile
              transport=${COMPONENT#algorithm-}
              build_args=(--build-arg "TRANSPORT=${transport%-onnx-cpu}")
              if [[ "$COMPONENT" == *-onnx-cpu ]]; then
                build_args+=(--build-arg ONNX_CPU=true)
              fi
              ;;
            *)
              echo "Unsupported component: $COMPONENT" >&2
              exit 1
              ;;
          esac

          image="ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}:sha-${GITHUB_SHA}"
          docker build --platform linux/amd64 \
            --file "$dockerfile" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" \
            "${build_args[@]}" "$context"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          docker push "$IMAGE"
          printf 'Published `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
